# Keeps the rendered docs/STATUS.md in step with the per-task ledger in docs/status/.
#
# Task branches never touch docs/STATUS.md — that is what keeps parallel tasks from
# conflicting — so the rendered view is refreshed here, on main, after each merge.
# Deleting this workflow is safe; the fallback is `npm run status:write` on main.
name: status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/status.ts write
      - name: Commit if the rendered view changed
        run: |
          if [ -n "$(git status --porcelain docs/STATUS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/STATUS.md
            git commit -m "docs: re-render STATUS.md from the status ledger"
            git push
          fi
